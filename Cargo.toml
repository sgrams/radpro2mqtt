[package]
name = "radpro2mqtt"
version = "0.1.0"
edition = "2024"
description = "Bridge a Rad Pro Geiger counter to MQTT with Home Assistant discovery"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sgrams/radpro2mqtt"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive", "env"] }
rumqttc = { version = "0.25.1", features = ["url"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "io-util"] }
tokio-serial = "5.5.0"
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
